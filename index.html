  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "Vocês já têm clientes ativos?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Somos uma empresa nova com metodologia sólida. Nosso diferencial é transparência: entregamos diagnóstico gratuito antes de qualquer proposta, sem compromisso. Você vê o que encontramos, o que propomos e decide com clareza."
        }
      },
      {
        "@type": "Question",
        "name": "Quanto custa?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Trabalhamos com proposta personalizada após o diagnóstico gratuito. Nosso compromisso é que o investimento caiba no momento da sua empresa — sem pacotes fixos que não fazem sentido pra você."
        }
      },
      {
        "@type": "Question",
        "name": "Preciso de contrato longo?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Não. Trabalhamos com ciclos curtos e renováveis. Você avalia o resultado antes de continuar. Acreditamos que cliente satisfeito não precisa de contrato para ficar."
        }
      },
      {
        "@type": "Question",
        "name": "O robô vai parecer robótico para meus clientes?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Não. O agente é treinado com o vocabulário, tom e informações do seu negócio — seus clientes vão perceber como um atendente treinado, não um bot genérico. Inclusive, a maioria nem percebe que está falando com IA."
        }
      },
      {
        "@type": "Question",
        "name": "E se eu já tiver um site?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Analisamos o que você já tem. Se o site atual converte bem, não mexemos. Se não converte, mostramos exatamente o que está travando — com dados, não com achismo."
        }
      },
      {
        "@type": "Question",
        "name": "Quanto tempo leva para tudo estar funcionando?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Em média, de 5 a 10 dias úteis para uma implementação completa: diagnóstico, planejamento, desenvolvimento do site ou agente de IA, testes e entrega. Para landing pages simples, o prazo pode ser menor."
        }
      },
      {
        "@type": "Question",
        "name": "A Mendes Tech atende empresas fora do Litoral Sul de SP?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Sim. Temos forte presença no Litoral Sul de SP (Peruíbe, Itanhaém, Mongaguá, Praia Grande e Santos), mas atendemos empresas em todo o território nacional de forma completamente remota — com a mesma qualidade e atenção."
        }
      }
    ]
  }
